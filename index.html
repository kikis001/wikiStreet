<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de personajes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-dark bg-dark border-bottom border-danger border-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Street Fighter</a>
    </div>
  </nav>

  <main class="container py-5">
    <header class="text-center mb-4">
      <p class="text-danger fw-semibold text-uppercase mb-2">Street Fighter</p>
      <h1 class="display-5 fw-bold">Selecciona personaje</h1>
      <button id="boton-coordenadas" class="btn btn-danger" type="button">Mostrar coordenadas</button>
    </header>

    <section aria-label="Mapa principal de personajes">
      <div class="card border-0 shadow-sm mapa-card">
        <div class="card-body p-2 p-md-3">
          <div class="lienzo imagen-principal mx-auto">
            <img id="imagen-principal" class="img-fluid" src="assets/street-fighter.png" alt="Personajes de Street Fighter">
            <div id="zonas-principales" class="capa-zonas"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="editor" class="oculto mt-5" aria-labelledby="titulo-coordenadas">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-dark text-white py-3">
          <h2 id="titulo-coordenadas" class="h4 mb-0">Editor de coordenadas</h2>
        </div>

        <div class="card-body p-3 p-lg-4">
          <div class="row g-4 align-items-start">
            <div class="col-lg-8">
              <div id="lienzo-editor" class="lienzo imagen-editor mx-auto">
                <img id="imagen-editor" class="img-fluid" src="assets/street-fighter.png" alt="Imagen para sacar coordenadas" draggable="false">
                <div id="zonas-editor" class="capa-zonas"></div>
                <div id="rectangulo-temporal" class="rectangulo oculto"></div>
              </div>
            </div>

            <div class="col-lg-4">
              <div class="formulario-coordenadas">
                <div id="mensaje" class="alert alert-secondary" role="status">
                  Selecciona un personaje y arrastra un rectángulo sobre la imagen.
                </div>

                <!-- Funcionalidad para subir otra imagen desactivada temporalmente.
                <div class="mb-3">
                  <label class="form-label" for="selector-imagen">Subir otra imagen</label>
                  <input id="selector-imagen" class="form-control" type="file" accept="image/*">
                </div>
                -->

                <div class="mb-3">
                  <label class="form-label" for="selector-personaje">Personaje</label>
                  <select id="selector-personaje" class="form-select"></select>
                </div>

                <form id="formulario-personaje" class="mb-3">
                  <label class="form-label" for="nombre-personaje">Agregar personaje</label>
                  <div class="input-group">
                    <input id="nombre-personaje" class="form-control" type="text" required>
                    <button class="btn btn-outline-dark" type="submit">Agregar</button>
                  </div>
                </form>

                <div class="d-grid gap-2 mb-4">
                  <button id="borrar-coordenada" class="btn btn-outline-danger" type="button">Borrar coordenada seleccionada</button>
                  <button id="limpiar-coordenadas" class="btn btn-outline-secondary" type="button">Limpiar coordenadas</button>
                </div>

                <label class="form-label fw-semibold" for="salida-json">Coordenadas en JSON</label>
                <textarea id="salida-json" class="form-control font-monospace" rows="15" readonly></textarea>
                <button id="copiar-json" class="btn btn-dark w-100 mt-3" type="button">Copiar JSON</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white-50 text-center py-3 mt-4">
    <small>proyecto de kk</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
