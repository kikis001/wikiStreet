<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Información del personaje</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-personaje bg-body-tertiary">
  <nav class="navbar navbar-dark bg-dark border-bottom border-danger border-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Street Fighter II</a>
      <a class="btn btn-outline-light btn-sm" href="index.html">Regresar al mapa</a>
    </div>
  </nav>

  <main class="container py-5" id="ficha-personaje">
    <article class="card mb-3 mx-auto border-0 shadow overflow-hidden ficha-personaje">
      <div class="row g-0 h-100">
        <div class="col-md-6 bg-dark">
          <div id="carrusel-personaje" class="carousel slide h-100" data-bs-interval="false">
            <div id="indicadores-carrusel" class="carousel-indicators"></div>
            <div id="imagenes-carrusel" class="carousel-inner h-100"></div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carrusel-personaje" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carrusel-personaje" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Siguiente</span>
            </button>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card-body p-4 p-xl-5 h-100 d-flex flex-column justify-content-center">
            <p class="text-danger fw-semibold text-uppercase mb-2">Ficha del personaje</p>
            <h1 id="detalle-nombre" class="display-4 fw-bold mb-2">Personaje</h1>
            <p id="detalle-frase" class="lead text-secondary mb-4"></p>

            <div class="border-top border-bottom py-3 mb-4">
              <dl class="row mb-0">
                <dt class="col-sm-4 text-secondary">País</dt>
                <dd id="detalle-pais" class="col-sm-8 fw-semibold">Sin información</dd>
                <dt class="col-sm-4 text-secondary">Estilo</dt>
                <dd id="detalle-estilo" class="col-sm-8 fw-semibold mb-0">Sin información</dd>
              </dl>
            </div>

            <h2 class="h5">Información</h2>
            <p id="detalle-descripcion" class="descripcion text-secondary mb-0"></p>
          </div>
        </div>
      </div>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="datos.js"></script>
  <script src="personaje.js"></script>
</body>
</html>
